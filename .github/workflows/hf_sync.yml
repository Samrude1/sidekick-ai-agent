name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error ::HF_TOKEN secret is not set in GitHub Repository Secrets (Settings -> Secrets and variables -> Actions -> New repository secret)."
            exit 1
          fi
          git config --global user.email "samrude@users.noreply.github.com"
          git config --global user.name "Samrude1"
          git push --force https://Samrude1:$HF_TOKEN@huggingface.co/spaces/Samrude1/Sidekick main:main || git push --force https://samrude1:$HF_TOKEN@huggingface.co/spaces/samrude1/Sidekick main:main
